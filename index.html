<!doctype html><html lang="pt-PT"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#9d3b24"><link rel="manifest" href="manifest.json"><title>Comandas</title>
<style>
:root{--bg:#f4f2ee;--card:#fff;--ink:#20201e;--muted:#77736c;--line:#e3ded5;--accent:#9d3b24}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line);padding:12px 14px}header h1{margin:0;font-size:20px}header small,.muted{color:var(--muted)}
nav{position:sticky;top:58px;z-index:19;display:flex;gap:6px;padding:8px;background:#fff;border-bottom:1px solid var(--line)}
nav button{flex:1;border:0;border-radius:10px;padding:10px 5px;font-weight:800;background:#eeeae3}nav button.active{background:var(--ink);color:#fff}
main{max-width:900px;margin:auto;padding:12px}.screen{display:none}.screen.active{display:block}.panel,.card{background:#fff;border:1px solid var(--line);border-radius:15px;padding:13px;margin-bottom:12px}
h2{margin:0 0 9px}label{font-weight:800;font-size:13px;display:block;margin:7px 0 4px}
input{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;font:inherit;background:#fff}
button{cursor:pointer;font:inherit}.primary,.danger,.ghost{border:0;border-radius:10px;padding:10px 12px;font-weight:800}.primary{background:var(--accent);color:#fff}.danger{background:#f4dcd6;color:#8d2f1d}.ghost{background:#eeeae3}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}.tabs{display:flex;gap:6px;overflow:auto;padding:5px 0 8px}
.tabs button{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:18px;padding:8px 11px;font-weight:700}.tabs button.active{background:#e9e4dc}
.products{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.product{border:1px solid var(--line);background:#fff;border-radius:12px;padding:11px;text-align:left;min-height:68px}.product strong{display:block}
.item,.cash-row{border-bottom:1px solid var(--line);padding:9px 0}.qty{display:flex;align-items:center;gap:6px}.qty button{width:30px;height:30px;border:1px solid var(--line);background:#fff;border-radius:8px}
.total{font-size:19px;font-weight:900;margin-top:10px}.empty{text-align:center;color:var(--muted);padding:20px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:10px}
.badge{display:inline-block;padding:4px 7px;border-radius:20px;background:#f5ddd7;color:#8d2f1d;font-size:11px;font-weight:900}
.delivery{display:flex;gap:9px;align-items:flex-start;padding:8px 0}.delivery input{width:22px;height:22px;margin:0;flex:0 0 auto}.done .name{text-decoration:line-through;color:var(--muted)}
.cash-row{display:flex;justify-content:space-between;gap:8px}.install{background:#fff3df;border:1px solid #e8c98e;border-radius:12px;padding:11px;margin-bottom:12px}
@media(min-width:650px){.products{grid-template-columns:repeat(3,1fr)}}
</style></head><body>
<header><h1>🍽️ Comandas</h1><small>Pedidos por mesa</small></header>
<nav><button id="navOrders" class="active" onclick="show('orders')">➕ Pedido</button><button id="navDelivery" onclick="show('delivery')">☑️ Entregas</button><button id="navCash" onclick="show('cash')">💶 Caixa</button></nav>
<main><div id="installBox" class="install" style="display:none"><b>Instalar a app</b><br><span class="muted">Usa o menu do navegador e escolhe “Adicionar ao ecrã principal”.</span></div>
<section id="orders" class="screen active"><div class="panel"><h2>Novo pedido</h2><label>Mesa</label><input id="table" placeholder="Ex.: Mesa 1"><div id="cats" class="tabs"></div><div id="products" class="products"></div></div>
<div class="panel"><div class="row"><h2>Pedido</h2><button class="ghost" onclick="clearCart()">Limpar</button></div><div id="cart"></div><div class="total">Total: <span id="cartTotal">0,00 €</span></div><button class="primary" style="width:100%;margin-top:11px" onclick="saveOrder()">Guardar pedido</button></div></section>
<section id="delivery" class="screen"><div class="panel"><div class="row"><div><h2>Entregas</h2><div class="muted">Assinala cada item quando for entregue.</div></div><button class="ghost" onclick="renderDelivery()">↻</button></div></div><div id="deliveryList" class="grid"></div></section>
<section id="cash" class="screen"><div class="panel"><div class="row"><div><h2>Caixa</h2><div class="muted">Resumo completo por mesa.</div></div><button class="danger" onclick="clearOrders()">Limpar tudo</button></div></div><div id="cashList"></div></section>
</main>
<script>
const PRODUCTS=[["water","Água","Bebidas",1.5],["soda","Refrigerante","Bebidas",2],["beer","Cerveja","Bebidas",2.5],["coffee","Café","Bebidas",1.2],["sandwich","Sandes","Comida",4.5],["burger","Hambúrguer","Comida",8.5],["fries","Batata frita","Comida",3],["cake","Bolo","Sobremesas",3]].map(x=>({id:x[0],name:x[1],cat:x[2],price:x[3]}));
let cart={},cat="Todos",orders=JSON.parse(localStorage.getItem("comandas")||"[]");
const money=n=>Number(n||0).toLocaleString("pt-PT",{style:"currency",currency:"EUR"}),esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m])),p=id=>PRODUCTS.find(x=>x.id===id),total=o=>o.items.reduce((s,i)=>s+i.price*i.qty,0);
function persist(){localStorage.setItem("comandas",JSON.stringify(orders))}
function show(id){document.querySelectorAll(".screen").forEach(x=>x.classList.remove("active"));document.getElementById(id).classList.add("active");document.querySelectorAll("nav button").forEach(x=>x.classList.remove("active"));document.getElementById("nav"+id[0].toUpperCase()+id.slice(1)).classList.add("active");if(id==="delivery")renderDelivery();if(id==="cash")renderCash()}
function renderCats(){let a=["Todos",...new Set(PRODUCTS.map(x=>x.cat))];document.getElementById("cats").innerHTML=a.map(x=>`<button class="${x===cat?"active":""}" onclick="cat=${JSON.stringify(x)};renderCats();renderProducts()">${esc(x)}</button>`).join("")}
function renderProducts(){document.getElementById("products").innerHTML=PRODUCTS.filter(x=>cat==="Todos"||x.cat===cat).map(x=>`<button class="product" onclick="add('${x.id}')"><strong>${esc(x.name)}</strong><small>${money(x.price)}</small></button>`).join("")}
function add(id){cart[id]=(cart[id]||0)+1;renderCart()}function ch(id,d){cart[id]=(cart[id]||0)+d;if(cart[id]<=0)delete cart[id];renderCart()}function clearCart(){cart={};renderCart()}
function renderCart(){let ids=Object.keys(cart);document.getElementById("cart").innerHTML=ids.length?ids.map(id=>{let x=p(id);return `<div class="item row"><div><b>${esc(x.name)}</b><div class="muted">${money(x.price)} cada</div></div><div class="qty"><button onclick="ch('${id}',-1)">−</button><b>${cart[id]}</b><button onclick="ch('${id}',1)">+</button></div><b>${money(x.price*cart[id])}</b></div>`}).join(""):`<div class="empty">Escolhe produtos.</div>`;document.getElementById("cartTotal").textContent=money(ids.reduce((s,id)=>s+p(id).price*cart[id],0))}
function saveOrder(){let table=document.getElementById("table").value.trim(),ids=Object.keys(cart);if(!table)return alert("Indica a mesa.");if(!ids.length)return alert("Adiciona pelo menos um produto.");orders.push({id:Date.now().toString(),table,createdAt:new Date().toISOString(),items:ids.map(id=>({id:Date.now()+"-"+id,name:p(id).name,price:p(id).price,qty:cart[id],delivered:false}))});persist();clearCart();document.getElementById("table").value="";alert("Pedido guardado para "+table+".")}
function renderDelivery(){let a=orders.filter(o=>o.items.some(i=>!i.delivered));document.getElementById("deliveryList").innerHTML=a.length?a.map(o=>`<div class="card"><span class="badge">MESA ${esc(o.table)}</span><div class="muted">${new Date(o.createdAt).toLocaleTimeString("pt-PT",{hour:"2-digit",minute:"2-digit"})} · ${money(total(o))}</div>${o.items.map(i=>`<label class="delivery ${i.delivered?"done":""}"><input type="checkbox" ${i.delivered?"checked":""} onchange="toggle('${o.id}','${i.id}',this.checked)"><span class="name"><b>${i.qty} × ${esc(i.name)}</b><br><span class="muted">${money(i.price*i.qty)}</span></span></label>`).join("")}</div>`).join(""):`<div class="panel empty">Não há itens por entregar.</div>`}
function toggle(oid,iid,v){let o=orders.find(x=>x.id===oid),i=o?.items.find(x=>x.id===iid);if(i){i.delivered=v;persist();renderDelivery()}}
function renderCash(){if(!orders.length){document.getElementById("cashList").innerHTML='<div class="panel empty">Ainda não existem pedidos.</div>';return}let map={},grand=0;orders.forEach(o=>(map[o.table]??=[]).push(o));document.getElementById("cashList").innerHTML=Object.keys(map).sort((a,b)=>a.localeCompare(b,"pt")).map(t=>{let os=map[t],sum=os.reduce((s,o)=>s+total(o),0);grand+=sum;return `<div class="panel"><div class="row"><h2>${esc(t)}</h2><div class="total">${money(sum)}</div></div>${os.map(o=>`<div style="margin-top:10px"><div class="muted">Pedido ${o.id.slice(-5)} · ${new Date(o.createdAt).toLocaleString("pt-PT")}</div>${o.items.map(i=>`<div class="cash-row"><span>${i.qty} × ${esc(i.name)}</span><b>${money(i.price*i.qty)}</b></div>`).join("")}<div class="row"><b>Total pedido</b><b>${money(total(o))}</b></div></div>`).join("")}</div>`}).join("")+`<div class="panel"><div class="row"><h2>Total geral</h2><div class="total">${money(grand)}</div></div></div>`}
function clearOrders(){if(confirm("Apagar todas as comandas deste telemóvel?")){orders=[];persist();renderCash();renderDelivery()}}
renderCats();renderProducts();renderCart();
if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("service-worker.js"));
</script></body></html>
